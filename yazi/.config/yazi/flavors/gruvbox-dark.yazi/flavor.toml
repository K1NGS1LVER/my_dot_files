# vim:fileencoding=utf-8:foldmethod=marker
# Migrated from poperigby/gruvbox-dark-yazi (old [manager] schema, no
# [pick]/[mode] split) to the current yazi flavor.toml schema. Status-bar
# permission/progress coloring is mapped from the old file's equivalents;
# no colors were invented.

# : Manager {{{

[mgr]
cwd = { fg = "#83a598" }

hovered         = { fg = "#282828", bg = "#83a598" }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#b8bb26", italic = true }
find_position = { fg = "#fe8019", bg = "reset", italic = true }

# Marker
marker_selected = { fg = "#b8bb26", bg = "#b8bb26" }
marker_copied   = { fg = "#b8bb26", bg = "#b8bb26" }
marker_cut      = { fg = "#fb4934", bg = "#fb4934" }

# Border
border_symbol = "│"
border_style  = { fg = "#665c54" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#282828", bg = "#504945" }
inactive = { fg = "#a89984", bg = "#3c3836" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#282828", bg = "#a89984", bold = true }
normal_alt  = { fg = "#282828", bg = "#a89984", bold = true }

select_main = { fg = "#282828", bg = "#b8bb26", bold = true }
select_alt  = { fg = "#282828", bg = "#b8bb26", bold = true }

unset_main = { fg = "#282828", bg = "#d3869b", bold = true }
unset_alt  = { fg = "#282828", bg = "#d3869b", bold = true }

# : }}}


# : Status bar {{{

[status]
progress_label  = { fg = "#ebdbb2", bold = true }
progress_normal = { fg = "#504945", bg = "#3c3836" }
progress_error  = { fg = "#fb4934", bg = "#3c3836" }

perm_sep   = { fg = "#665c54" }
perm_type  = { fg = "#504945" }
perm_read  = { fg = "#b8bb26" }
perm_write = { fg = "#fb4934" }
perm_exec  = { fg = "#b8bb26" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#bdae93" }
active   = { fg = "#fe8019" }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#bdae93" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#504945" }
title   = {}
hovered = { underline = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "#3c3836" }
cand            = { fg = "#83a598" }
rest            = { fg = "#928374" }
desc            = { fg = "#fe8019" }
separator       = "  "
separator_style = { fg = "#504945" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#fe8019" }
run     = { fg = "#83a598" }
hovered = { bg = "#504945", bold = true }
footer  = { fg = "#3c3836", bg = "#a89984" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#83a598" },

    # Videos
    { mime = "{audio,video}/*", fg = "#b8bb26" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#fe8019" },

    # Fallback
    { url = "*", fg = "#a89984" },
    { url = "*/", fg = "#83a598" },
]

# : }}}
