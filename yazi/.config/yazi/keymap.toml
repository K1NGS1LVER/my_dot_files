"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]
keymap = [
    # Core
    { on = "<Esc>", run = "escape", desc = "Exit" },
    { on = "<A-q>", run = "quit",   desc = "Quit" },

    # Navigation (Only standard keys allowed)
    { on = "k",      run = "arrow prev" },
    { on = "j",      run = "arrow next" },
    { on = "h",      run = "leave" },
    { on = "l",      run = "enter" },
    { on = "<Up>",   run = "arrow prev" },
    { on = "<Down>", run = "arrow next" },
    { on = "<Left>",  run = "leave" },
    { on = "<Right>", run = "enter" },
    { on = "<Enter>", run = "open" },

    # Hardened Commands (All prefixed with Alt)
    { on = "<A-r>", run = "rename --cursor=before_ext" },
    { on = "<A-a>", run = "create" },
    { on = "<A-f>", run = "filter --smart" },
    { on = "<A-d>", run = "remove" },
    { on = "<A-D>", run = "remove --permanently" },
    { on = "<A-y>", run = "yank" },
    { on = "<A-x>", run = "yank --cut" },
    { on = "<A-p>", run = "paste" },
    { on = "<A-P>", run = "paste --force" },
    { on = "<A-/>", run = "find --smart" },
    { on = "<A-?>", run = "find --previous --smart" },
    { on = "<A-;>", run = "shell --interactive" },
    { on = "<A-:>", run = "shell --block --interactive" },
    { on = "<A-s>", run = "search --via=fd" },
    { on = "<A-S>", run = "search --via=rg" },
    { on = "<A-v>", run = "visual_mode" },
    { on = "<A-V>", run = "visual_mode --unset" },
    { on = "<A-t>", run = "tab_create --current" },
    { on = "<A-w>", run = "tasks:show" },
    { on = "<A-z>", run = "plugin fzf" },
    { on = "<A-Z>", run = "plugin zoxide" },

    # Chords (Also prefixed with Alt)
    { on = [ "<A-g>", "h" ], run = "cd ~" },
    { on = [ "<A-g>", "c" ], run = "cd ~/.config" },
    { on = [ "<A-c>", "c" ], run = "copy path" },
    { on = [ "<A-m>", "s" ], run = "linemode size" },
    { on = [ "<A-,>", "m" ], run = "sort mtime" },
]

[input]
keymap = [
    { on = "<C-c>",   run = "close" },
    { on = "<Enter>", run = "close --submit" },
    { on = "<Esc>",   run = "escape" },
]

[confirm]
keymap = [
    { on = "<Esc>",   run = "close" },
    { on = "y",       run = "close --submit" },
    { on = "n",       run = "close" },
]
