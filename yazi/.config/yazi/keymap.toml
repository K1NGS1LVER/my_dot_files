"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]
keymap = [
    # Core
    { on = "<Esc>", run = "escape", desc = "Exit" },
    { on = "q",     run = "quit",   desc = "Quit" },
    { on = "<A-q>", run = "quit",   desc = "Quit (Alt)" },

    # Navigation
    { on = "k",      run = "arrow prev" },
    { on = "j",      run = "arrow next" },
    { on = "h",      run = "leave" },
    { on = "l",      run = "enter" },
    { on = "<Up>",   run = "arrow prev" },
    { on = "<Down>", run = "arrow next" },
    { on = "<Left>",  run = "leave" },
    { on = "<Right>", run = "enter" },
    { on = "<Enter>", run = "open" },
    { on = "<Space>", run = [ "toggle", "arrow next" ], desc = "Toggle selection" },
    { on = "v",       run = "visual_mode", desc = "Visual mode" },
    { on = "y",       run = "yank", desc = "Copy" },
    { on = "x",       run = "yank --cut", desc = "Cut" },
    { on = "p",       run = "paste", desc = "Paste" },

    # Hardened Commands
    { on = "<A-r>", run = "rename --cursor=before_ext" },
    { on = "<A-a>", run = "create" },
    { on = "<A-f>", run = "filter --smart" },
    { on = "<A-d>", run = "remove" },
    { on = "<A-D>", run = "remove --permanently" },
    { on = "<A-/>", run = "find --smart" },
    { on = "<A-?>", run = "find --previous --smart" },
    { on = "<A-;>", run = "shell --interactive" },
    { on = "<A-:>", run = "shell --block --interactive" },
    { on = "<A-s>", run = "search --via=fd" },
    { on = "<A-S>", run = "search --via=rg" },
    { on = "<A-t>", run = "tab_create --current" },
    { on = "<A-w>", run = "tasks:show" },
    { on = "<A-z>", run = "plugin fzf" },
    { on = "<A-Z>", run = "plugin zoxide" },

    # Chords
    { on = [ "<A-g>", "h" ], run = "cd ~" },
    { on = [ "<A-g>", "c" ], run = "cd ~/.config" },
    { on = [ "<A-c>", "c" ], run = "copy path" },
    { on = [ "<A-m>", "s" ], run = "linemode size" },
    { on = [ "<A-,>", "m" ], run = "sort mtime" },
]

[input]
keymap = [
    { on = "<C-c>",   run = "close" },
    { on = "<Enter>", run = "close --submit" },
    { on = "<Esc>",   run = "escape" },
    { on = "<Backspace>", run = "backspace" },
    { on = "<Delete>",    run = "backspace --under" },
    { on = "<Left>",      run = "move -1" },
    { on = "<Right>",     run = "move 1" },
    { on = "<C-a>",       run = "move bol" },
    { on = "<C-e>",       run = "move eol" },
]

[confirm]
keymap = [
    { on = "<Esc>",   run = "close" },
    { on = "y",       run = "close --submit" },
    { on = "n",       run = "close" },
]
