# Yazi Configuration (User Override)

[manager]
query_foreground = false
query_background = false
theme_mode = "dark"
show_hidden = true
show_symlink = true
[opener]
book = [
    { run = 'open -a Books "$@"', orphan = true, desc = "Apple Books" }
]

[open]
prepend_rules = [
    { url = "*.epub", use = "book" }
]

[status]
separator_open  = ""
separator_close = ""
show_right = ["permissions", "percentage", "position", "timestamp", "size"]

[preview]
preview_protocol = "kitty"
image_filter = "lanczos3"
max_width = 800
max_height = 1000
