# Yazi Configuration (User Override)

[mgr]
show_hidden = false
show_symlink = true

[open]
prepend_rules = [
    { name = "*.epub", use = "book" },
    { name = "*.pdf", use = "book" }
]
append_rules = [
    { name = "*", use = "system" }
]

[opener]
book = [
    { run = 'open -a Books "$@"', orphan = true, desc = "Apple Books" },
    { run = 'open -b com.apple.iBooksX "$@"', orphan = true, desc = "Apple Books (Bundle ID)" }
]
system = [
    { run = 'open "$@"', orphan = true, desc = "System Default" }
]

[status]
separator_open  = ""
separator_close = ""
show_right = ["permissions", "percentage", "position", "timestamp", "size"]
