# Yazi Configuration (Zellij Override)
# Reason: Zellij's graphics support is still unreliable. We launch Yazi with
# TERM=xterm-kitty in Zellij so it falls back to the safe non-graphics preview
# path instead of using buggy terminal image escape sequences.

[manager]
query_foreground = false
query_background = false
theme_mode = "dark"
show_hidden = true
show_symlink = true

[opener]
book = [
    { run = 'open -a Books "$@"', orphan = true, desc = "Apple Books" }
]

[open]
prepend_rules = [
    { name = "*.epub", use = "book" }
]

[status]
separator_open  = ""
separator_close = ""
show_right = ["permissions", "percentage", "position", "timestamp", "size"]

[preview]
# Keep previews conservative inside Zellij to reduce churn while scrolling.
max_width = 800
max_height = 1000
image_filter = "nearest"
image_delay = 100
