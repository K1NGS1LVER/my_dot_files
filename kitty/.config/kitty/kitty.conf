# --- Kitty Configuration ---

# otpimisation 
# Scrollback is the #1 memory hog — default is 2000
scrollback_lines 5000
# Disable scrollback pager buffer (stores copy in RAM)
scrollback_pager_history_size 0

# Reduce redraws
repaint_delay 16
input_delay 3
sync_to_monitor yes

# Disable update checks
update_check_interval 0

# Disable audio bell processing
enable_audio_bell no

# No desktop notifications
notify_on_cmd_finish never

# Disable remote control (runs a socket listener)
allow_remote_control no

# single_instance no

# --- Fonts ---
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        18.0

# Enable ligatures
disable_ligatures never

# Adjust rendering (optional)
text_composition_strategy legacy

# --- Tab Bar Styling (tmux-like) ---
tab_bar_edge bottom
tab_bar_style separator
tab_separator "/"
tab_bar_min_tabs 1
tab_title_template "{fmt.fg._939ab7}{fmt.bg.default} {index}:{title} "
active_tab_title_template "{fmt.fg._6B5C8F}{fmt.bg.default}{fmt.bold} {index}:{title} "
mouse_hide_wait -1.0

active_tab_foreground   #6B5C8F
active_tab_background   #24273a
active_tab_font_style   bold
inactive_tab_foreground #939ab7
inactive_tab_background #24273a
inactive_tab_font_style normal
tab_bar_background      #24273a

# --- Theme ---
include themes/current-theme.conf


# --- Animations & Performance ---
# This enables the "inbetween frame animations" (Cursor Trail)
cursor_trail 10
cursor_trail_decay 0.06 0.2
cursor_trail_start_threshold 5

# Performance tweaks for high refresh rate monitors
repaint_delay 6
input_delay 2
sync_to_monitor yes

# --- Window & UI ---
# map_waiting_time 2.0
resize_debounce_time 0.1
# resize_draw_strategy static
resize_in_steps no


window_padding_width 0
placement_strategy center
hide_window_decorations yes
confirm_os_window_close 1
background_opacity 0.75
background_blur 25
dynamic_background_opacity yes
macos_show_window_title_in none

# Silence OpenGL warnings if possible
# stderr_path /dev/null


# --- Shell Integration ---
shell_integration enabled
shell /bin/zsh

# --- Remote Control (Allows Vim to talk to Kitty) ---
allow_remote_control yes
listen_on unix:/tmp/mykitty

# --- macOS Option Key as Alt ---
macos_option_as_alt yes

# --- Layouts ---
enabled_layouts splits,stack

# --- tmux-like Mappings (Leader: Ctrl+a) ---

# Splitting
map ctrl+a>v launch --location=vsplit --cwd=current
map ctrl+a>s launch --location=hsplit --cwd=current
map ctrl+a>| launch --location=vsplit --cwd=current
map ctrl+a>- launch --location=hsplit --cwd=current

# Navigation (Windows/Panes)
# Standardized: Ctrl + Arrows for direct, lightning-fast navigation (Mission Control disabled)
map ctrl+left neighboring_window left
map ctrl+down neighboring_window down
map ctrl+up neighboring_window up
map ctrl+right neighboring_window right

# Standardized 'Close' (Universal X)
map ctrl+a>x close_window
map ctrl+a>q close_window

# Tab Management
map ctrl+a>c new_tab_with_cwd
map ctrl+a>w close_tab
map ctrl+a>r set_tab_title

# Tab Navigation (1-9)
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

map shift+left previous_tab
map shift+right next_tab
# Removed H/L mappings to avoid conflicts with hjkl

# Zoom / Maximize (matches your 'z' binding)
map ctrl+a>z toggle_layout stack

# Clear Screen (L is much more standard for this anyway)
map ctrl+a>L combine : clear_terminal scrollback active : send_text normal \x0c

# Send Ctrl+a to the terminal by pressing it twice
map ctrl+a>ctrl+a send_text all \x01
