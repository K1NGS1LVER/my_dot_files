# None — plain terminal, no theme/accent colors (standard xterm 16-color palette)

[colors.primary]
background = "#000000"
foreground = "#e5e5e5"
dim_foreground = "#7f7f7f"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#000000"
cursor = "#e5e5e5"

[colors.selection]
text = "#000000"
background = "#7f7f7f"

[colors.normal]
black = "#000000"
red = "#cd0000"
green = "#00cd00"
yellow = "#cdcd00"
blue = "#0000ee"
magenta = "#cd00cd"
cyan = "#00cdcd"
white = "#e5e5e5"

[colors.bright]
black = "#7f7f7f"
red = "#ff0000"
green = "#00ff00"
yellow = "#ffff00"
blue = "#5c5cff"
magenta = "#ff00ff"
cyan = "#00ffff"
white = "#ffffff"
