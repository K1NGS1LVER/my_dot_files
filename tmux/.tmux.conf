# -- General Settings --
set -g default-shell /opt/homebrew/bin/nu
set -s escape-time 0   # Remove delay for Esc key (Vital for Vim/Caps Lock users)
set -g mouse on

# -- True Color Support --
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# -- Prefix: Ctrl+a --
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind C-b send-prefix

# -- Split Keys --
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# -- Navigation --
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -- Reload & Management --
bind r command-prompt -I "#W" "rename-window '%%'"
bind R source-file ~/.tmux.conf \; display "Config Reloaded!"
bind w kill-window
bind c new-window -c "#{pane_current_path}"

# -- Catppuccin Theme (Macchiato) --
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default fg=#cad3f5'
set -g status-left '#[fg=#939ab7,bg=default,bold]  #{?client_prefix,TM,N}  '
set -g status-right '#[fg=#939ab7]%H:%M #[fg=#939ab7]%d-%b'
set -g status-right-length 50
set -g status-left-length 20

set-option -g focus-events on

# Window Styling
setw -g window-status-current-style 'fg=#6B5C8F,bg=default,bold'
setw -g window-status-current-format ' #I:#W'

setw -g window-status-style 'fg=#939ab7,bg=default'
setw -g window-status-format ' #I:#W'

# Pane Borders
set -g pane-border-style 'fg=#5b6078'
set -g pane-active-border-style 'fg=#c6a0f6'

# -- Smart Pane Switching with Vim --
# This handles seamless navigation between tmux panes and vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Restore Clear Screen functionality with Prefix + L
bind C-l send-keys 'C-l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# -- Window Navigation --
bind -n S-Left  previous-window
bind -n S-Right next-window
