# Kanagawa Wave — tmux status bar palette
# Roles: text=Fg, muted=Comment, border=Selection, accent=Purple
# Identical role mapping to the other files in this directory — do not edit one without the others.

set -g status-style 'bg=default fg=#dcd7ba'
set -g status-left '#[fg=#727169,bg=default,bold]  #{?client_prefix,TM,N}  '
set -g status-right '#[fg=#727169]%H:%M #[fg=#727169]%d-%b'

setw -g window-status-current-style 'fg=#957fb8,bg=default,bold'
setw -g window-status-style 'fg=#727169,bg=default'

set -g pane-border-style 'fg=#2d4f67'
set -g pane-active-border-style 'fg=#957fb8'
