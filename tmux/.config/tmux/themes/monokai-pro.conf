# Monokai Pro — tmux status bar palette
# Roles: text=Fg, muted=Comment, border=Selection, accent=Purple
# Identical role mapping to the other files in this directory — do not edit one without the others.

set -g status-style 'bg=default fg=#fcfcfa'
set -g status-left '#[fg=#727072,bg=default,bold]  #{?client_prefix,TM,N}  '
set -g status-right '#[fg=#727072]%H:%M #[fg=#727072]%d-%b'

setw -g window-status-current-style 'fg=#ab9df2,bg=default,bold'
setw -g window-status-style 'fg=#727072,bg=default'

set -g pane-border-style 'fg=#403e41'
set -g pane-active-border-style 'fg=#ab9df2'
