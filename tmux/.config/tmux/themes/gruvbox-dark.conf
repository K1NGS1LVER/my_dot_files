# Gruvbox Dark — tmux status bar palette
# Roles: text=Fg, muted=Comment, border=Selection, accent=Purple
# Identical role mapping to the other files in this directory — do not edit one without the others.

set -g status-style 'bg=default fg=#ebdbb2'
set -g status-left '#[fg=#928374,bg=default,bold]  #{?client_prefix,TM,N}  '
set -g status-right '#[fg=#928374]%H:%M #[fg=#928374]%d-%b'

setw -g window-status-current-style 'fg=#d3869b,bg=default,bold'
setw -g window-status-style 'fg=#928374,bg=default'

set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#d3869b'
