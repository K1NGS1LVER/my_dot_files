# Catppuccin Macchiato — tmux status bar palette
# Roles: text=Text, muted=Overlay2, border=Surface2, accent=Mauve
# Identical role mapping to the other files in this directory — do not edit one without the others.

set -g status-style 'bg=default fg=#cad3f5'
set -g status-left '#[fg=#939ab7,bg=default,bold]  #{?client_prefix,TM,N}  '
set -g status-right '#[fg=#939ab7]%H:%M #[fg=#939ab7]%d-%b'

setw -g window-status-current-style 'fg=#c6a0f6,bg=default,bold'
setw -g window-status-style 'fg=#939ab7,bg=default'

set -g pane-border-style 'fg=#5b6078'
set -g pane-active-border-style 'fg=#c6a0f6'
