# Tokyo Night Storm — tmux status bar palette
# Roles: text=Fg, muted=Comment, border=Selection, accent=Purple
# Identical role mapping to the other files in this directory — do not edit one without the others.

set -g status-style 'bg=default fg=#a9b1d6'
set -g status-left '#[fg=#565f89,bg=default,bold]  #{?client_prefix,TM,N}  '
set -g status-right '#[fg=#565f89]%H:%M #[fg=#565f89]%d-%b'

setw -g window-status-current-style 'fg=#bb9af7,bg=default,bold'
setw -g window-status-style 'fg=#565f89,bg=default'

set -g pane-border-style 'fg=#343b58'
set -g pane-active-border-style 'fg=#bb9af7'
