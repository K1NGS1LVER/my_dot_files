# None — plain terminal, no theme/accent colors
# Roles: text=plain white, muted=gray, border=dark gray, accent=plain blue
# Same plain xterm 16-color set used by kitty/ghostty/alacritty/yazi for this theme.

set -g status-style 'bg=default fg=#d8dee9'
set -g status-left '#[fg=#4c566a,bg=default,bold]  #{?client_prefix,TM,N}  '
set -g status-right '#[fg=#4c566a]%H:%M #[fg=#4c566a]%d-%b'

setw -g window-status-current-style 'fg=#81a1c1,bg=default,bold'
setw -g window-status-style 'fg=#4c566a,bg=default'

set -g pane-border-style 'fg=#2e3440'
set -g pane-active-border-style 'fg=#81a1c1'
