# None — plain terminal, no theme/accent colors
# Roles: text=plain white, muted=gray, border=dark gray, accent=plain blue
# Same plain xterm 16-color set used by kitty/ghostty/alacritty/yazi for this theme.

set -g status-style 'bg=default fg=#e5e5e5'
set -g status-left '#[fg=#7f7f7f,bg=default,bold]  #{?client_prefix,TM,N}  '
set -g status-right '#[fg=#7f7f7f]%H:%M #[fg=#7f7f7f]%d-%b'

setw -g window-status-current-style 'fg=#0000ee,bg=default,bold'
setw -g window-status-style 'fg=#7f7f7f,bg=default'

set -g pane-border-style 'fg=#3c3c3c'
set -g pane-active-border-style 'fg=#0000ee'
