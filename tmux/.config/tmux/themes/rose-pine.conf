# Rose Pine — tmux status bar palette
# Roles: text=Fg, muted=Comment, border=Selection, accent=Purple
# Identical role mapping to the other files in this directory — do not edit one without the others.

set -g status-style 'bg=default fg=#e0def4'
set -g status-left '#[fg=#908caa,bg=default,bold]  #{?client_prefix,TM,N}  '
set -g status-right '#[fg=#908caa]%H:%M #[fg=#908caa]%d-%b'

setw -g window-status-current-style 'fg=#c4a7e7,bg=default,bold'
setw -g window-status-style 'fg=#908caa,bg=default'

set -g pane-border-style 'fg=#403d52'
set -g pane-active-border-style 'fg=#c4a7e7'
