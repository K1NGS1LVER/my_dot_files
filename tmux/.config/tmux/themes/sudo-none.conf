# Sudo-none — none's plain xterm-16 palette on a solid dark status bar.
# Unlike none's transparent `bg=default`, the bar is anchored to the theme's
# dark base so it stays readable over light wallpapers.

set -g status-style 'bg=#141414 fg=#e6e6e6'
set -g status-left '#[fg=#4d4d4d,bg=#141414,bold]  #{?client_prefix,TM,N}  '
set -g status-right '#[fg=#4d4d4d,bg=#141414]%H:%M #[fg=#4d4d4d,bg=#141414]%d-%b'

setw -g window-status-current-style 'fg=#81a1c1,bg=#141414,bold'
setw -g window-status-style 'fg=#4d4d4d,bg=#141414'

set -g pane-border-style 'fg=#2e2e2e'
set -g pane-active-border-style 'fg=#81a1c1'
