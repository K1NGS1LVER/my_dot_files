# Sudo-none — none's plain xterm-16 palette on a solid dark status bar.
# Unlike none's transparent `bg=default`, the bar is anchored to the theme's
# dark base so it stays readable over light wallpapers.

set -g status-style 'bg=#141821 fg=#e4e9f1'
set -g status-left '#[fg=#4c566a,bg=#141821,bold]  #{?client_prefix,TM,N}  '
set -g status-right '#[fg=#4c566a,bg=#141821]%H:%M #[fg=#4c566a,bg=#141821]%d-%b'

setw -g window-status-current-style 'fg=#81a1c1,bg=#141821,bold'
setw -g window-status-style 'fg=#4c566a,bg=#141821'

set -g pane-border-style 'fg=#2e3440'
set -g pane-active-border-style 'fg=#81a1c1'
