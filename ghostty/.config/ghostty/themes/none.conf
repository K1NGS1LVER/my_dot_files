# None — plain terminal, no theme/accent colors (standard xterm 16-color palette)
# Low-opacity window with strong macOS backdrop blur keeps the desktop visible
# without sacrificing terminal readability.
background-opacity      = 0.35
background-blur-radius  = 65
# Explicit colors, not a bundled `theme = <name>` reference: unlike the other
# 6 registry themes, there's no guarantee any bundled Ghostty theme matches
# this exact palette. See scripts/switch-theme's apply_theme().
background = #1f2430
foreground = #d8dee9
cursor-color = #d8dee9
selection-background = #4c566a
selection-foreground = #1f2430

palette = 0=#2e3440
palette = 1=#d08770
palette = 2=#a3be8c
palette = 3=#ebcb8b
palette = 4=#81a1c1
palette = 5=#b48ead
palette = 6=#88c0d0
palette = 7=#d8dee9
palette = 8=#4c566a
palette = 9=#e69a83
palette = 10=#b8d99f
palette = 11=#f2dca4
palette = 12=#9bbbd8
palette = 13=#c6a5c2
palette = 14=#9dd6e3
palette = 15=#eceff4
