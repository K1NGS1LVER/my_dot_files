# Sudo-none — none's plain xterm-16 palette, anchored darker for light wallpapers.
# Same accent DNA as none (same nord-ish set); readability over bright desktops
# comes from a higher opacity + darker base, not a new palette. fg is brightened
# two steps vs none so light-gray text never sits on a washed-out composite.
background-opacity      = 0.70
background-blur-radius  = 80
# Explicit colors, not a bundled `theme = <name>` reference: unlike the other
# 6 registry themes, there's no guarantee any bundled Ghostty theme matches
# this exact palette. See scripts/switch-theme's apply_theme().
background = #141821
foreground = #e4e9f1
cursor-color = #e4e9f1
selection-background = #3a4150
selection-foreground = #141821

palette = 0=#2e3440
palette = 1=#d08770
palette = 2=#a3be8c
palette = 3=#ebcb8b
palette = 4=#81a1c1
palette = 5=#b48ead
palette = 6=#88c0d0
palette = 7=#e4e9f1
palette = 8=#4c566a
palette = 9=#e69a83
palette = 10=#b8d99f
palette = 11=#f2dca4
palette = 12=#9bbbd8
palette = 13=#c6a5c2
palette = 14=#9dd6e3
palette = 15=#f2f5fa
