# --- Minimal Multi-Line Config (Interactively Generated) ---

# Add a newline between prompts for clarity
add_newline = true

# Custom prompt format
# Top line: Info
# Bottom line: The character (>)
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$python\
$golang\
$java\
$lua\
$cmd_duration
$character"""

[directory]
style = "bold cyan"
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold purple"
format = " [$symbol$branch]($style)"

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style))"

[character]
# Bottom line prompt
success_symbol = "[>](bold blue) "
error_symbol = "[>](bold red) "

# --- Language Modules ---
[nodejs]
symbol = " "
style = "bold green"
format = " via [$symbol($version )]($style)"

[python]
symbol = "🐍 "
style = "bold yellow"
format = " via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold blue"
format = " via [$symbol($version )]($style)"

[java]
symbol = "☕ "
style = "bold orange"
format = " via [$symbol($version )]($style)"

[rust]
symbol = "🦀 "
style = "bold red"
format = " via [$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = " took [$duration]($style)"
