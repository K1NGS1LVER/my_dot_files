# Starship: Minimal two-line prompt.
# Line 1: directory + git state, right-aligned duration/battery when they matter.
# Line 2: just the prompt character.
# Named ANSI colors (not hex) so it adapts to whatever terminal theme is active.

format = """
$directory$git_branch$git_status$fill$cmd_duration$battery
$character"""

right_format = ""

[fill]
symbol = " "

[line_break]
disabled = false

[directory]
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " "
style = "bold bright-black"
truncation_symbol = "…/"

[git_branch]
symbol = ""
format = "[$symbol$branch]($style) "
style = "bright-black"

[git_status]
disabled = false
format = '[$all_status$ahead_behind]($style) '
style = "yellow"
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "bright-black"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[battery]
format = "[$percentage]($style) "

[[battery.display]]
threshold = 15
style = "bold red"

# --- Everything else stays quiet unless it matters ---
[git_metrics]
disabled = true

[status]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[package]
disabled = true

[os]
disabled = true

[kubernetes]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[golang]
disabled = true

[rust]
disabled = true

[bun]
disabled = true

[c]
disabled = true

[cpp]
disabled = true

[cmake]
disabled = true
