# Starship: High-Signal, Zero-Noise Configuration
# Focus: Context -> State -> Performance -> Action

format = """$directory$git_branch$git_status$status$cmd_duration$python$nodejs
$character"""

# Spicy right-side flair (Subtle)
right_format = """[󱐋](dimmed white)"""

add_newline = true

[directory]
truncation_length = 0
home_symbol = "~"
read_only = " "
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold #7ed1fb"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold green"

[git_status]
disabled = false
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow" # Signal: Uncommitted work needs attention
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[status]
disabled = false
format = '[\[$symbol $exit_code\]]($style) '
symbol = "✘"
success_symbol = "" # Invisible on success
style = "bold red"

[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold dimmed yellow"

[python]
symbol = "󰌠 "
# Only show when in a virtualenv or pyenv
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style) '
style = "bold yellow"
pyenv_prefix = "pyenv "
python_binary = ["python", "python3"]

[nodejs]
symbol = "󰎙 "
format = "via [$symbol($version )]($style) "
style = "bold green"

[character]
success_symbol = "╰⎯ "
error_symbol = "[╰⎯](bold red) "

# --- Explicitly Disable Redundant Modules ---
[username]
disabled = true

[hostname]
disabled = true

[kubernetes]
disabled = true

[package]
disabled = true

[os]
disabled = true

[battery]
disabled = true
