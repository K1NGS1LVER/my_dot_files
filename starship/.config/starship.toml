# Starship: High-Signal Left, Dimmed Pac-Man Right
# Focus: Vibrant context on the left, subtle state on the right
# Configured with dynamic ANSI colors so it adapts to the active terminal theme.

format = """
[╭⎯](bold bright-black)$directory$git_branch$git_metrics$git_status$fill$python$nodejs$golang$rust$bun$c$cpp$cmake$battery$cmd_duration
[╰⎯](bold purple) """

# Pac-Man Right Prompt - DIMMED (bright-black)
right_format = """[󰮯 ](bold bright-black)$status"""

[fill]
symbol = " "

[line_break]
disabled = false

[directory]
truncation_length = 3
truncate_to_repo = true
home_symbol = " ~"
read_only = " "
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
truncation_symbol = "…/"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

[git_status]
disabled = false
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[status]
symbol = ""
success_symbol = ""
disabled = false
format = '[$exit_code]($style)'
style = "bold red"
pipestatus = true

[cmd_duration]
min_time = 500
show_milliseconds = false
format = "took [$duration]($style) "
style = "bold yellow"

[python]
symbol = "󰌠 "
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style) '
style = "bold yellow"
pyenv_prefix = "pyenv "

[nodejs]
symbol = "󰎙 "
format = "via [$symbol($version )]($style) "
style = "bold green"

[golang]
symbol = " "
format = "via [$symbol($version )]($style) "
style = "bold blue"

[rust]
symbol = "󱘗 "
format = "via [$symbol($version )]($style) "
style = "bold yellow"

[bun]
symbol = " "
format = "via [$symbol($version )]($style) "
style = "bold yellow"

[c]
symbol = " "
format = "via [$symbol($version )]($style) "
style = "bold blue"

[cpp]
symbol = " "
format = "via [$symbol($version )]($style) "
style = "bold blue"

[cmake]
symbol = " "
format = "via [$symbol($version )]($style) "
style = "bold blue"

[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 15
style = "bold red"

# --- Explicitly Disable Redundant/Slow Modules ---
[username]
disabled = true

[hostname]
disabled = true

[package]
disabled = true

[os]
disabled = true

[kubernetes]
disabled = true

[character]
disabled = true
